<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Perfect Fox Orbit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="loading-container">
    <div class="ball"></div>
<div class="controls">
    <button onclick="changeSpeed(8)" style="background:#999;">Slow</button>
<button onclick="changeSpeed(4)" style="background:#6ec6ff;">Normal</button>
<button onclick="changeSpeed(2)" style="background:#33cc33;">Fast</button>
<button onclick="changeSpeed(1)" style="background:#ff3333;">Super Fast</button>
<button onclick="changeSpeed(0.5)" style="background:#ff00ff;">Hyper Speed</button>

<button onclick="changeColor('orange')" style="background: orange;">Orange</button>
<button onclick="changeColor('white')" style="background: white; color: black;">White</button>
<button onclick="changeColor('blue')" style="background: #4da6ff;">Blue</button>
<button onclick="changeColor('red')" style="background: red;">Red</button>
<button onclick="changeColor('green')" style="background: #00cc44;">Green</button>
<button onclick="changeColor('purple')" style="background: #b300ff;">Purple</button>
<button onclick="changeColor('pink')" style="background: #ff66cc;">Pink</button>
<button onclick="changeColor('yellow')" style="background: yellow; color: black;">Yellow</button>

</div>

    <div class="orbit">
        <img src="https://static.wikia.nocookie.net/minecraft/images/7/73/Fox.png/revision/latest?cb=20191116044014" class="fox">
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
